<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менделеева таблица</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #cccccc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Анимирано заглавие */
        .header {
            text-align: center;
            padding: 20px 0;
            position: relative;
            z-index: 10;
        }

        #blink {
            color: #2c3e50;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { 
                opacity: 0.7; 
                transform: scale(0.98);
            }
            to { 
                opacity: 1; 
                transform: scale(1.02);
            }
        }

        /* Основен контейнер */
        .container {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* Странични полета с градиент */
        .sidebar {
            width: 150px;
            background: linear-gradient(45deg, #f8f9fa, #6c757d, #ffffff, #495057);
            background-size: 400% 400%;
            animation: gradientShift 4s ease infinite;
            position: relative;
            overflow: hidden;
        }

        .sidebar-left {
            border-right: 3px solid #007bff;
        }

        .sidebar-right {
            border-left: 3px solid #007bff;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Анимирани елементи в страничните полета */
        .animated-element {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            opacity: 0.7;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .element-1 {
            top: 10%;
            left: 20%;
            animation: float 3s ease-in-out infinite;
        }

        .element-2 {
            top: 30%;
            right: 20%;
            animation: float 4s ease-in-out infinite reverse;
        }

        .element-3 {
            top: 60%;
            left: 30%;
            animation: rotate 5s linear infinite;
        }

        .element-4 {
            bottom: 10%;
            right: 30%;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-10px); }
        }

        /* Централно съдържание */
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        /* Стилове за периодичната таблица */
        .periodic-table {
            max-width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .periodic-table:hover {
            transform: scale(1.02);
        }

        .periodic-table img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Допълнителни анимирани елементи */
        .floating-particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #007bff, transparent);
            border-radius: 50%;
            animation: particleFloat 15s linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 6s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 8s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 10s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 12s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 14s; }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        /* Респонсивност */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            
            #blink {
                font-size: 1.8rem;
            }
            
            .main-content {
                padding: 10px;
            }
        }

        /* Допълнителни химични символи в страничните полета */
        .chemical-symbol {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            animation: symbolPulse 3s ease-in-out infinite;
        }

        @keyframes symbolPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .symbol-1 { top: 15%; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
        .symbol-2 { top: 35%; left: 50%; transform: translateX(-50%); animation-delay: 1s; }
        .symbol-3 { top: 55%; left: 50%; transform: translateX(-50%); animation-delay: 2s; }
        .symbol-4 { bottom: 25%; left: 50%; transform: translateX(-50%); animation-delay: 3s; }
    </style>
</head>
